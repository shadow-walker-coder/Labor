<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retail Earnings Monitor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="What big-box retailer earnings say about the U.S. consumer and economy.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a briefing up top (verdict, pulse tiles, themes), then a category filter row,
   then one card per retailer, the comp heatmap, and the earnings calendar.
   Category headers borrow the condensed lettering of store aisle signs. */
:root {
  --paper: #f3f5f2;          /* page plane: slightly green-grey, like store shelving */
  --card: #ffffff;
  --ink: #15201b;
  --ink-2: #4c5a53;
  --muted: #7d8a83;
  --rule: #dce2dd;
  --grid: #e6ebe7;
  --accent: #0f6b57;         /* deep shelf-tag green */
  --accent-soft: rgba(15, 107, 87, 0.10);
  --tag: #ffd84a;            /* price-tag yellow, used once per card */
  --tag-ink: #1d1a05;
  --bar: #2a78d6;            /* single data series */
  --div-pos-3: #1c5cab; --div-pos-2: #5598e7; --div-pos-1: #b7d3f6;
  --div-mid: #ecece8;
  --div-neg-1: #f6c4bf; --div-neg-2: #e66d64; --div-neg-3: #b8302c;
  --strong: #14833b; --strong-bg: rgba(20, 131, 59, 0.12);
  --steady: #2a6fb5; --steady-bg: rgba(42, 111, 181, 0.12);
  --choosy: #a8650b; --choosy-bg: rgba(214, 140, 20, 0.16);
  --strained: #c0392f; --strained-bg: rgba(192, 57, 47, 0.12);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1412; --card: #171e1b; --ink: #e8eeea; --ink-2: #b4c0b9; --muted: #84918a;
    --rule: #28322d; --grid: #222b27; --accent: #4cc4a4; --accent-soft: rgba(76, 196, 164, 0.14);
    --tag: #f2cc3a; --tag-ink: #1d1a05; --bar: #3987e5;
    --div-pos-3: #5598e7; --div-pos-2: #256abf; --div-pos-1: #1b3d66;
    --div-mid: #2a2f2c;
    --div-neg-1: #5c2725; --div-neg-2: #b2423b; --div-neg-3: #e66767;
    --strong: #4cc27f; --strong-bg: rgba(76, 194, 127, 0.15);
    --steady: #6aa8ec; --steady-bg: rgba(106, 168, 236, 0.15);
    --choosy: #e6aa4a; --choosy-bg: rgba(230, 170, 74, 0.16);
    --strained: #ef7a70; --strained-bg: rgba(239, 122, 112, 0.15);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1412; --card: #171e1b; --ink: #e8eeea; --ink-2: #b4c0b9; --muted: #84918a;
  --rule: #28322d; --grid: #222b27; --accent: #4cc4a4; --accent-soft: rgba(76, 196, 164, 0.14);
  --tag: #f2cc3a; --tag-ink: #1d1a05; --bar: #3987e5;
  --div-pos-3: #5598e7; --div-pos-2: #256abf; --div-pos-1: #1b3d66;
  --div-mid: #2a2f2c;
  --div-neg-1: #5c2725; --div-neg-2: #b2423b; --div-neg-3: #e66767;
  --strong: #4cc27f; --strong-bg: rgba(76, 194, 127, 0.15);
  --steady: #6aa8ec; --steady-bg: rgba(106, 168, 236, 0.15);
  --choosy: #e6aa4a; --choosy-bg: rgba(230, 170, 74, 0.16);
  --strained: #ef7a70; --strained-bg: rgba(239, 122, 112, 0.15);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 64px; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { text-wrap: balance; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Masthead */
.mast { padding-block: 32px 8px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; }
.mast h1 { margin: 0; font: 700 clamp(38px, 6vw, 60px)/0.95 var(--display); text-transform: uppercase; letter-spacing: 0.01em; }
.mast h1 span { color: var(--accent); }
.mast p { margin: 8px 0 0; color: var(--ink-2); max-width: 60ch; }
.stamp { font: 12px/1.6 var(--mono); color: var(--muted); text-align: right; }
.stamp b { color: var(--ink); font-weight: 600; }

/* Briefing */
.brief { padding-block: 16px 8px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 900px) { .brief { grid-template-columns: minmax(0, 1fr); } }
.eyebrow { font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.verdict { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.verdict h2 { margin: 0; font: 600 clamp(26px, 3.2vw, 36px)/1.1 var(--display); letter-spacing: 0.005em; }
.verdict .sum { margin: 0; color: var(--ink-2); max-width: 64ch; }
.points { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--rule); }
.points li { padding: 12px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
.points b { font-weight: 700; }
.points p { margin: 0; color: var(--ink-2); font-size: 14px; }
.autonote { font-size: 12px; color: var(--muted); }

.pulse { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font: 600 28px/1.15 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.tile .s { font-size: 12px; color: var(--ink-2); }
.mix { display: flex; height: 26px; gap: 2px; border-radius: 5px; overflow: hidden; }
.mix div { display: flex; align-items: center; justify-content: center; font: 600 11px var(--mono); color: #fff; min-width: 0; overflow: hidden; white-space: nowrap; }
.mix .strong { background: var(--strong); } .mix .steady { background: var(--steady); }
.mix .choosy { background: var(--choosy); } .mix .strained { background: var(--strained); }
.mixkey { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.mixkey i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.themes { display: grid; gap: 6px; }
.theme { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 1.5rem; gap: 10px; align-items: center; font-size: 13px; }
.theme .lab { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.theme .track { height: 10px; background: var(--grid); border-radius: 0 4px 4px 0; position: relative; }
.theme .fill { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 0 4px 4px 0; }
.theme .n { font: 600 12px var(--mono); text-align: right; }

/* Page strip */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); border-top: 1px solid var(--rule); margin-top: 16px; }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 8px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a {
  flex: none; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  font: 600 13px var(--body); color: var(--ink-2); padding: 6px 11px; border-radius: 999px; border: 1px solid transparent;
}
.tabs a:hover { color: var(--ink); border-color: var(--rule); background: var(--card); }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--paper); }
.tabs .pn { font: 600 11px var(--mono); opacity: 0.6; }
.arrows { display: flex; gap: 4px; flex: none; }
.arrows button { font: 600 15px var(--mono); width: 34px; height: 32px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); cursor: pointer; }
.arrows button:hover:not(:disabled) { border-color: var(--accent); }
.arrows button:disabled { opacity: 0.35; cursor: default; }

/* One page */
.page-head { padding-block: 28px 4px; display: grid; gap: 6px; }
.page-head h2 { margin: 0; font: 700 clamp(30px, 4.4vw, 44px)/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
.page-head > p { margin: 0; color: var(--ink-2); max-width: 70ch; }
.glance { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.glance .g { display: inline-flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--card); border: 1px solid var(--rule); border-radius: 8px; text-decoration: none; color: var(--ink); }
.glance .g:hover { border-color: var(--accent); }
.glance .gn { font-weight: 700; }
.glance .gv { font-weight: 600; }
#page.enter { animation: pagein 0.28s ease-out; }
@keyframes pagein { from { opacity: 0.35; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #page.enter { animation: none; } }
.pager { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding-block: 32px 48px; }
.pager .pg { display: grid; gap: 2px; padding: 12px 16px; border: 1px solid var(--rule); border-radius: 10px; background: var(--card); text-decoration: none; color: var(--ink); min-width: 0; }
.pager .pg:hover { border-color: var(--accent); }
.pager .pg span { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.pager .pg b { font: 700 18px/1.15 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
.pager .next { text-align: right; }
.pager .count { font-size: 12px; color: var(--muted); }
@media (max-width: 520px) {
  .pager { grid-template-columns: 1fr 1fr; }
  .pager .count { grid-column: 1 / -1; grid-row: 2; text-align: center; }
  .pager .pg b { font-size: 15px; }
}

/* Category blocks */
.cat { padding-block: 20px 4px; }
.cat-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; margin-bottom: 14px; }
.cat-head h2 {
  margin: 0; font: 700 24px/1 var(--display); text-transform: uppercase; letter-spacing: 0.04em;
  background: var(--ink); color: var(--paper); padding: 6px 10px 5px; border-radius: 4px;
}
.cat-head p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 70ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 16px; }

/* Retailer card */
.rc { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.rc-top { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.rc-name { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.rc h3 { margin: 0; font: 700 22px/1.1 var(--display); letter-spacing: 0.01em; }
.rc .tk { font: 600 12px var(--mono); color: var(--muted); }
.rc .when { font: 12px var(--mono); color: var(--muted); }
.verd { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 999px; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
.verd::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.verd.strong { color: var(--strong); background: var(--strong-bg); }
.verd.steady { color: var(--steady); background: var(--steady-bg); }
.verd.choosy { color: var(--choosy); background: var(--choosy-bg); }
.verd.strained { color: var(--strained); background: var(--strained-bg); }
.badge { font: 600 11px var(--mono); padding: 2px 7px; border-radius: 4px; border: 1px dashed var(--muted); color: var(--ink-2); }
.says { margin: 0; font-size: 16px; line-height: 1.4; font-weight: 600; }
.says::before { content: "What it says"; display: block; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 3px; }

/* Shelf-tag metric strip: the comp number gets the yellow price tag */
.strip { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; justify-items: start; }
.pricetag {
  background: var(--tag); color: var(--tag-ink); border-radius: 4px 10px 10px 4px; padding: 8px 12px 7px 20px;
  position: relative; display: flex; flex-direction: column; justify-content: center; min-width: 7.5rem;
}
.pricetag::before { content: ""; position: absolute; left: 6px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--card); }
.pricetag .v { font: 700 30px/1 var(--mono); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.pricetag .l { font-size: 11px; line-height: 1.25; margin-top: 3px; max-width: 9.5rem; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 16px; width: 100%; }
.kv div { display: flex; justify-content: space-between; gap: 6px; font-size: 12.5px; border-bottom: 1px dotted var(--rule); padding: 2px 0; min-width: 0; }
.kv span { color: var(--muted); white-space: nowrap; }
.kv b { font: 600 12.5px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.up { color: var(--strong); } .dn { color: var(--strained); }

.msgs { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14px; }
.msgs li::marker { color: var(--accent); }
.consumer { font-size: 13.5px; color: var(--ink-2); display: grid; gap: 4px; }
.consumer b { color: var(--ink); }
.quote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; font-size: 13.5px; font-style: italic; }
.macro { font-size: 13.5px; padding-top: 10px; border-top: 1px solid var(--rule); }
.macro b { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-right: 6px; }
.rc .themes-row { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--grid); color: var(--ink-2); }

.spark { position: relative; }
.spark svg { display: block; width: 100%; height: auto; overflow: visible; }
.spark text { fill: var(--muted); font: 10px var(--mono); }
.spark .lbl { fill: var(--ink-2); font-weight: 600; }
.spark-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 2px; }

details.hist { font-size: 13.5px; border-top: 1px solid var(--rule); padding-top: 8px; }
details.hist summary { cursor: pointer; font-weight: 600; color: var(--accent); list-style: none; }
details.hist summary::-webkit-details-marker { display: none; }
details.hist summary::before { content: "+ "; font-family: var(--mono); }
details.hist[open] summary::before { content: "− "; }
.past { display: grid; gap: 10px; margin-top: 10px; }
.past div { display: grid; gap: 2px; }
.past .ph { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.past .ph b { font-family: var(--mono); font-size: 12px; }
.past p { margin: 0; color: var(--ink-2); }
.srcs { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.srcs a { color: var(--muted); }
.srcs a:hover { color: var(--accent); }

/* Sections below the cards */
.sec { padding-block: 40px 8px; }
.sec-head { margin-bottom: 14px; display: grid; gap: 4px; }
.sec-head h2 { margin: 0; font: 700 30px/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
.sec-head p { margin: 0; color: var(--ink-2); max-width: 75ch; }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; }
.scroll { overflow-x: auto; }
table.heat { border-collapse: separate; border-spacing: 3px; width: 100%; min-width: 560px; font-size: 13px; }
.heat th { font: 600 11px var(--mono); color: var(--muted); text-align: center; padding: 4px; white-space: nowrap; }
.heat th.rowh { text-align: left; color: var(--ink); font: 600 13px var(--body); }
.heat th.rowh span { font: 11px var(--mono); color: var(--muted); margin-left: 6px; }
.heat td { text-align: center; font: 600 13px var(--mono); font-variant-numeric: tabular-nums; padding: 9px 4px; border-radius: 4px; color: var(--ink); background: var(--div-mid); cursor: default; }
.heat td.na { background: transparent; color: var(--muted); font-weight: 400; }
.heat td.p3 { background: var(--div-pos-3); color: #fff; } .heat td.p2 { background: var(--div-pos-2); color: #fff; } .heat td.p1 { background: var(--div-pos-1); }
.heat td.n1 { background: var(--div-neg-1); } .heat td.n2 { background: var(--div-neg-2); color: #fff; } .heat td.n3 { background: var(--div-neg-3); color: #fff; }
.heat td.pending { outline: 1px dashed var(--muted); outline-offset: -2px; }
.scale { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--muted); margin-top: 10px; }
.scale i { width: 26px; height: 12px; border-radius: 2px; display: inline-block; }

.cal { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.cal .ev { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: center; }
.cal .date { grid-row: span 2; text-align: center; border-right: 1px solid var(--rule); padding-right: 12px; }
.cal .date b { display: block; font: 700 26px/1 var(--display); }
.cal .date span { font: 600 11px var(--mono); color: var(--muted); text-transform: uppercase; }
.cal .who { font-weight: 700; }
.cal .what { font-size: 12px; color: var(--muted); }
.cal .ev.past-ev { opacity: 0.6; }

.tip { position: absolute; pointer-events: none; z-index: 20; background: var(--ink); color: var(--paper); font: 12px/1.45 var(--mono); padding: 6px 9px; border-radius: 5px; white-space: pre; transform: translate(-50%, calc(-100% - 8px)); }
.foot { margin: 20px auto 0; padding-top: 0; font-size: 13px; color: var(--muted); display: grid; gap: 8px; }
.foot > * { max-width: 100ch; }
.foot p { margin: 0; }
@media (max-width: 520px) {
  .tiles { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .theme { grid-template-columns: minmax(0, 8.5rem) minmax(0, 1fr) 1.5rem; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
.heat-sec { padding-block: 12px 0; }
.heat-sec .sec-head p { font-size: 14px; }
.dnotes { font-size: 12.5px; color: var(--ink-2); background: var(--grid); border-radius: 6px; padding: 8px 10px; }
.dnotes b { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.dnotes ul { margin: 4px 0 0; padding-left: 16px; display: grid; gap: 3px; }
.past .pnote { font-size: 12px; color: var(--muted); }
.heat td.growth { outline: 2px dashed var(--ink-2); outline-offset: -4px; }
.foot h2 { margin: 8px 0 0; font: 700 22px/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; color: var(--ink); }
.datanotes { margin: 0; display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr); gap: 8px 20px; }
.datanotes dt { font-weight: 700; color: var(--ink); }
.datanotes dd { margin: 0; }
@media (max-width: 640px) { .datanotes { grid-template-columns: minmax(0, 1fr); gap: 2px; } .datanotes dd { margin-bottom: 8px; } }
.kv div.wide { grid-column: 1 / -1; }
.cal .conf { color: var(--strong); font-weight: 600; }
.cal .basis { display: block; margin-top: 2px; font-size: 11.5px; color: var(--muted); }
.glance .gtag { font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); border: 1px dashed var(--muted); border-radius: 4px; padding: 1px 5px; }
.scale .growth-key { width: 26px; height: 12px; border: 2px dashed var(--ink-2); border-radius: 2px; background: transparent; }

/* Executive summary */
.exec { display: grid; gap: 22px; padding-block: 12px 0; }
.bottom { background: var(--ink); color: var(--paper); border-radius: 12px; padding: 22px 24px; display: grid; gap: 10px; }
.bottom .eyebrow { color: var(--paper); opacity: 0.65; }
.bl-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.bottom .autonote { color: var(--paper); opacity: 0.6; }
.block { display: grid; gap: 10px; min-width: 0; }

@media (max-width: 1000px) { .score { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.score .v .up { color: var(--strong); } .score .v .dn { color: var(--strained); }

.seg th, .seg td { padding: 11px 14px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }

.seg tbody tr:last-child th, .seg tbody tr:last-child td { border-bottom: 0; }

.seg th[scope="row"] { min-width: 12rem; }
.seg th[scope="row"] a { color: var(--ink); font-weight: 700; text-decoration: none; display: block; }
.seg th[scope="row"] a:hover { color: var(--accent); text-decoration: underline; }
.seg th[scope="row"] span { display: block; font: 400 12px var(--body); color: var(--muted); margin-top: 2px; }
.seg td.num { font-weight: 600; white-space: nowrap; }
.seg .gnote { display: block; font: 600 10px var(--mono); text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; }
.seg .delta.up { color: var(--strong); } .seg .delta.dn { color: var(--strained); }
.seg td.read { color: var(--ink-2); min-width: 18rem; }
.cols3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .cols3 { grid-template-columns: minmax(0, 1fr); } }
.col { background: var(--card); border: 1px solid var(--rule); border-top: 4px solid var(--steady); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.col.pos { border-top-color: var(--strong); } .col.neg { border-top-color: var(--strained); } .col.watch { border-top-color: var(--choosy); }
.col h3 { margin: 0 0 8px; font: 700 20px/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
.col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.col li { display: grid; gap: 2px; font-size: 13.5px; }
.col li span { color: var(--ink-2); }
.panel.themes { display: grid; gap: 6px; }
@media (max-width: 600px) { .score .tile:first-child { grid-column: 1 / -1; } }

h.","Agreed to buy Depop from Etsy for $1.2bn; dividend raised 7% to $0.31 and buyback authorization raised by $2bn."],"consumer":{"verdict":"steady","income_split":null,"big_ticket":"Holiday-quarter demand healthy in enthusiast and refurbished categories; international weaker than US.","pricing":null,"quote":null},"themes":["value_seeking","discretionary_ok","digital_strength"],"macro_read":"Holiday 2025 discretionary demand held up on eBay, with refurbished goods and collectibles growing and the US outperforming abroad. Buyer counts were nearly flat.","one_offs_undisclosed":false,"notes":["Revenue $2.97bn comes from Zacks/Investing coverage; the release headline rounds it to $3.0bn.","Revenue consensus left null because sources disagree ($2.87bn vs $2.89bn). EPS consensus uses Zacks ($1.36); other outlets cited $1.35.","Stock reaction left null: shares rose ~6.8-7.3% after hours and ~7-8% premarket, but the Feb 19 close was not confirmed.","A call summary says return/cancellation rates stabilized as buyers and sellers adjusted to US trade-policy changes; the source text was truncated, so this is unconfirmed.","Tise acquisition adds ~1M buyers to the count."],"sources":[{"label":"eBay Q4/FY2025 release (ebayinc.com)","url":"https://www.ebayinc.com/stories/news/ebay-inc-reports-fourth-quarter-and-full-year-2025-results/"},{"label":"eBay Q4 2025 8-K Ex. 99.1 (SEC)","url":"https://www.sec.gov/Archives/edgar/data/1065088/000106508826000017/exhibit991erebayq42025.htm"},{"label":"Investing.com: eBay shares jump as Q4 beat, Depop deal","url":"https://www.investing.com/news/earnings/ebay-shares-jump-as-q4-earnings-beat-depop-acquisition-announced-4512157"},{"label":"Benzinga: eBay tops Q4, agrees to acquire Depop","url":"https://www.benzinga.com/markets/earnings/26/02/50706524/ebay-tops-q4-earnings-agrees-to-acquire-depop-shares-spring-higher"},{"label":"Yahoo/Zacks: EBAY Q4 earnings surpass estimates","url":"https://finance.yahoo.com/news/ebay-q4-earnings-surpass-estimate d more than broad consumer health. Buyer growth stayed near flat.","one_offs_undisclosed":false,"notes":["Bullion boost was flagged as transitory; it drives most of the guided Q1-to-Q2 slowdown.","Big FX tailwind: reported GMV growth (18%) well above FX-neutral (14%).","US GMV +27% figure comes from call summaries; its exact definition is unconfirmed.","EPS consensus is Zacks ($1.66 beat by 5.06%); some auto-generated sites cite $1.61. Revenue consensus is Zacks' post-report figure; its pre-report figure was $3.02bn.","Stock reaction: sources conflict (+3.36% vs -1.24%), so left null.","No tariff/de minimis commentary found for this call."],"sources":[{"label":"eBay Q1 2026 release (investor site)","url":"https://investors.ebayinc.com/investor-news/press-release-details/2026/eBay-Inc--Reports-First-Quarter-2026-Results/default.aspx"},{"label":"eBay Q1 2026 8-K Ex. 99.1 (SEC)","url":"https://www.sec.gov/Archives/edgar/data/0001065088/000106508826000092/exhibit991erebayq12026.htm"},{"label":"Zacks: eBay Q1 earnings & revenues surpass estimates","url":"https://www.zacks.com/stock/news/2912258/ebay-q1-earnings-revenues-surpass-estimates-both-increase-yy"},{"label":"Yahoo: eBay Q1 2026 earnings call summary","url":"https://finance.yahoo.com/markets/stocks/articles/ebay-inc-q1-2026-earnings-001646209.html"},{"label":"Motley Fool Q1 2026 call transcript","url":"https://www.fool.com/earnings/call-transcripts/2026/04/29/ebay-ebay-q1-2026-earnings-call-transcript/"},{"label":"Investing.com Q1 2026 call transcript","url":"https://uk.investing.com/news/stock-market-news/earnings-call-transcript-ebay-q1-2026-earnings-beat-expectations-stock-rises-93CH-4639233"}],"eps_surprise_pct":5.1,"rev_surprise_pct":2.0,"status":"reviewed","file":"reports/EBAY/2026-03-31.json","cal_quarter":"2026 Q1"},{"ticker":"EBAY","fiscal_period":"Q2 2026","period_end":"2026-06-30","report_date":"2026-08-05","headline":"eBay's Q2 GMV grew 14% FX-neutral on a trading-card-led US surge; it beat estimates and raised full-year targets.","metrics":{"revenue_bn":3.13,"revenue_yoy_pct":15,"revenue_consensus_bn":3.01,"comp_pct":14,"comp_label":"GMV growth, FX-neutral","traffic_pct":null,"ticket_pct":null,"ecom_yoy_pct":null,"gross_margin_bps":null,"eps_adj":1.6,"eps_consensus":1.51,"eps_ex_one_offs":null,"inventory_yoy_pct":null,"stock_reaction_pct":null},"guidance":"raised","guidance_note":"Raised FY26 outlook incl. Depop (FX-neutral GMV growth reported as 11.5-12.5% vs 7-7.5% prior); Q3 GMV $22.0-22.4bn, rev $3.07-3.12bn, EPS $1.36-1.42.","key_messages":["GMV $22.4bn, +15% reported / +14% FX-neutral; FX added ~1 pt.","US GMV $11.69bn (+24%) vs international $10.71bn (+6%), so growth was concentrated in the US.","Active buyers 136M, +2% YoY (flat QoQ); US active buyers ~+6%, US enthusiast buyers +9%.","Focus-category GMV +26%, now >40% of GMV; trading cards led (NBA Finals, World Cup); bullion lift faded vs prior quarters.","Non-GAAP EPS $1.60 (+17%) vs GAAP $1.21; Depop's ~9M buyers join the count from Q3."],"consumer":{"verdict":"steady","income_split":null,"big_ticket":"Enthusiast/collectibles spend strong (trading cards, coins, toys, memorabilia); gold/silver bullion a smaller tailwind than in Q4-Q1.","pricing":null,"quote":null},"themes":["discretionary_ok","digital_strength"],"macro_read":"Discretionary enthusiast spending in the US was robust in spring 2026, but buyer growth was only 2%, so this mostly shows deep-pocketed hobbyists spending more rather than broad consumer strength.","one_offs_undisclosed":false,"notes":["FY GMV guidance range 11.5-12.5% comes from secondary coverage (Teleborsa summary) and includes Depop; not verified against the release.","Revenue consensus is implied from Zacks' 3.85% beat; 24/7 Wall St cited ~$3.02bn.","Stock reaction on Aug 6 not found; left null.","No Q2 management comments on tariffs/de minimis were found."],"sources":[{"label":"eBay Q2 2026 release (ebayinc.com)","url":"https://www.ebayinc.com/stories/news/ebay-inc-reports-second-quarter-2026-results/"},{"label":"eBay Q2 2026 8-K Ex. 99.1 (SEC)","url":"https://www.sec.gov/Archives/edgar/data/0001065088/000106508826000174/exhibit991erebayq22026.htm"},{"label":"Yahoo/Zacks: EBAY Q2 earnings beat on higher GMV and ad growth","url":"https://finance.yahoo.com/markets/stocks/articles/ebay-q2-earnings-beat-estimates-135500085.html"},{"label":"Yahoo: eBay Q2 2026 earnings call highlights","url":"https://finance.yahoo.com/markets/stocks/articles/ebay-inc-ebay-q2-2026-051149469.html"},{"label":"Value Added Resource: eBay Q2 2026 earnings","url":"https://www.valueaddedresource.net/ebay-q2-2026-earnings/"},{"label":"Teleborsa: eBay Q2 guidance raised","url":"https://www.teleborsa.it/AMP/News/2026/08/06/ebay-secondo-trimestre-in-crescita-oltre-le-attese-guidance-in-rialzo-51.html"},{"label":"MarketBeat: eBay Q3 2026 guidance","url":"https://www.marketbeat.com/instant-alerts/ebay-nasdaqebay-issues-q3-2026-earnings-guidance-2026-08-05/"}],"eps_surprise_pct":6.0,"rev_surprise_pct":4.0,"status":"reviewed","file":"reports/EBAY/2026-06-30.json","cal_quarter":"2026 Q2"},{"ticker":"EBAY","fiscal_period":"Q3 2026","period_end":"2026-09-30","report_date":"2026-10-28","headline":"eBay beat on Q3 as GMV rose 16% FX-neutral, helped by Depop and collectibles; full-year outlook raised.","metrics":{"revenue_bn":3.2,"revenue_yoy_pct":14,"revenue_consensus_bn":3.11,"comp_pct":16,"comp_label":"GMV growth, FX-neutral (incl. Depop, ~3 pts)","traffic_pct":null,"ticket_pct":null,"ecom_yoy_pct":null,"gross_margin_bps":null,"eps_adj":1.51,"eps_consensus":1.41,"eps_ex_one_offs":null,"inventory_yoy_pct":null,"stock_reaction_pct":null},"guidance":"raised","guidance_note":"FY26 non-GAAP EPS raised to $6.25-6.30, revenue $12.62-12.67bn, GMV $91.5-91.9bn; Q4 GMV $23.7-24.1bn (+12-14% FX-neutral, ~4 pts Depop).","key_messages":["GMV $23.2bn, +15% reported / +16% FX-neutral; Depop (closed Jul 30) added nearly 3 pts, so organic growth was ~13%.","US GMV ~$12.55bn (+27%) vs international ~$10.62bn (+4%), per a Zacks summary; international growth driven by UK and German focus categories/C2C.","Active buyers 147M including acquisitions; 136M organic, up just 1% YoY. US active buyers +6% organic (+13% pro forma with Depop).","Focus-category GMV +24%, led by collectibles, Motors, fashion and refurbished; management expects trading-card growth to moderate.","Advertising revenue $607M; GAAP EPS fell 13% to $1.11 while non-GAAP EPS rose 12%; ~9% staff cut announced Oct 20."],"consumer":{"verdict":"steady","income_split":null,"big_ticket":"Discretionary enthusiast categories (collectibles, Motors parts, fashion, refurbished) grew broadly; no explicit macro caution found.","pricing":null,"quote":"eBay's strong third quarter results reflect continued momentum across our business priorities and customer segments as more consumers embrace recommerce. (CEO Jamie Iannone, via press coverage)"},"themes":["value_seeking","discretionary_ok","digital_strength"],"macro_read":"Strong spend on collectibles and secondhand goods points to resilient discretionary demand from enthusiasts, while flat organic buyer counts show eBay's growth comes from deeper spend by existing buyers rather than a broad consumer surge.","one_offs_undisclosed":false,"notes":["Depop acquisition (closed Jul 30, 2026) inflates growth: nearly 3 pts of FX-neutral GMV growth per CFO; one source said ~2.5 pts guided.","Revenue is the release's rounded headline ($3.2bn); exact figure not confirmed.","US/international GMV split comes from a Zacks summary, not verified against the release.","Restructuring (~9% of staff, per Oct 20 8-K coverage) charges mostly fall in Q4 2026 GAAP results.","Stock reaction: shares rose ~4.7% after hours; regular-session close on Oct 29 not confirmed, so left null.","No Q3 2026 management comments on tariffs/de minimis were found."],"sources":[{"label":"eBay Q3 2026 release (investor site)","url":"https://investors.ebayinc.com/investor-news/press-release-details/2026/eBay-Inc--Reports-Third-Quarter-2026-Results/default.aspx"},{"label":"eBay Q3 2026 8-K Ex. 99.1 (SEC)","url":"https://www.sec.gov/Archives/edgar/data/0001065088/000106508826000209/exhibit991erebayq32026.htm"},{"label":"eBay Q3 2026 10-Q (SEC)","url":"https://www.sec.gov/Archives/edgar/data/0001065088/000106508826000212/ebay-20260930.htm"},{"label":"Investing.com: eBay shares jump on Q3 beat and raised guidance","url":"https://www.investing.com/news/earnings/ebay-shares-jump-5-on-strong-q3-earnings-beat-and-raised-guidance-93CH-4980670"},{"label":"Digital Commerce 360: eBay Q3 2026 GMV rises 15% as Depop adds growth","url":"https://www.digitalcommerce360.com/article/ebay-sales/"},{"label":"Yahoo/Zacks: EBAY Q3 earnings & revenues beat","url":"https://finance.yahoo.com/markets/stocks/articles/ebay-q3-earnings-revenues-beat-144600413.html"},{"label":"GuruFocus Q3 2026 call highlights","url":"https://www.gurufocus.com/news/9150185/ebay-inc-ebay-q3-2026-earnings-call-highlights-gmv-surges-16-as-focus-categories-ebay-live-and-depop-fuel-broadbased-momentum"},{"label":"Zacks Q3 preview (consensus)","url":"https://www.zacks.com/stock/news/3015201/ebay-gears-up-to-report-q3-earnings-whats-in-store-for-the-stock"}],"eps_surprise_pct":7.1,"rev_surprise_pct":2.9,"status":"reviewed","file":"reports/EBAY/2026-09-30.json","cal_quarter":"2026 Q3"},{"ticker":"ETSY","fiscal_period":"Q4 2025","period_end":"2025-12-31","report_date":"2026-02-19","headline":"Etsy marketplace GMS turned barely positive (+0.1%) in holiday Q4 as buyers kept shrinking; Etsy agreed to sell Depop to eBay for $1.2bn.","metrics":{"revenue_bn":0.8816,"revenue_yoy_pct":3.5,"revenue_consensus_bn":0.885,"comp_pct":0.1,"comp_label":"Etsy marketplace GMS (−1% FX-neutral)","traffic_pct":null,"ticket_pct":null,"ecom_yoy_pct":null,"gross_margin_bps":null,"eps_adj":0.92,"eps_consensus":null,"inventory_yoy_pct":null,"stock_reaction_pct":null,"eps_ex_one_offs":null},"guidance":"initiated","guidance_note":"Q1 2026 GMS guided to $2.38-2.43bn; FY 2026 expected to show slight YoY GMS growth with gains in every quarter; take rate ~25.5%.","key_messages":["Etsy marketplace GMS +0.1% YoY, its first positive comparison since Q3 2023, but -1% FX-neutral. Consolidated GMS $3.59bn (-3.8%; +2.4% ex-Reverb).","Active buyers 86.5m (TTM), -3.4% YoY and flat versus Q3; habitual buyers reportedly -8.6% YoY and purchase frequency still below last year.","App GMS growth sped up to +6.6%, app about 46% of GMS; agentic/AI-referred traffic up ~15x but under 1% of total.","Depop (Q4 GMS ~$300m, +38%) to be sold to eBay for $1.2bn in cash; Kruti Patel Goyal's first call as CEO."],"consumer":{"verdict":"choosy","income_split":null,"big_ticket":"Holiday-quarter discretionary GMS was flat ex-FX, with fewer buyers and fewer habitual buyers.","pricing":null,"quote":null},"themes":["digital_strength"],"macro_read":"Flat holiday GMS and a shrinking buyer base at a discretionary gift marketplace point to cautious, selective goods spending in late 2025.","one_offs_undisclosed":false,"notes":["Consolidated GMS fell 3.8% as reported, or rose 2.4% excluding Reverb, which was sold in 2025.","Etsy reports GAAP only; eps_adj is GAAP diluted EPS ($0.92). Net income of $110.7m was down YoY mainly because Q4 2024 included a non-cash FX gain.","Reverb was sold in mid-2025, so reported revenue (+3.5%) and GMS (-3.8%) understate the underlying trend (+6.6% revenue and +2.4% GMS ex-Reverb). Q4 2025 figures still include Depop.","EPS consensus left null: sources cited $0.84 and $0.85. Revenue consensus ($885m) is from secondary coverage; some outlets called revenue in line.","Stock reaction left null: sources conflict (+21.4% pre-market/early, 'more than 11%', +9.3%, +8.39% on the following day).","Habitual-buyer decline (-8.6%) comes from secondary call summaries."],"sources":[{"label":"Etsy Q4/FY2025 release (investors.etsy.com)","url":"https://investors.etsy.com/news-events/press-releases/detail/218/etsy-inc-reports-fourth-quarter-and-full-year-2025-results"},{"label":"Etsy Q4 2025 release (SEC 8-K Ex. 99.1)","url":"https://www.sec.gov/Archives/edgar/data/1370637/000137063726000017/exhibit99112312025.htm"},{"label":"Barchart: release text with outlook","url":"https://www.barchart.com/story/news/300269/etsy-inc-reports-fourth-quarter-and-full-year-2025-results"},{"label":"Yahoo Finance: Etsy shares surge on Depop sale","url":"https://finance.yahoo.com/news/etsy-shares-surge-depop-sale-151600001.html"},{"label":"Investing.com Q4 2025 call transcript","url":"https://www.investing.com/news/transcripts/earnings-call-transcript-etsys-q4-2025-eps-beats-forecast-stock-surges-93CH-4514105"},{"label":"Motley Fool Q4 2025 call transcript","url":"https://www.fool.com/earnings/call-transcripts/2026/02/19/etsy-etsy-q4-2025-earnings-call-transcript"}],"eps_surprise_pct":null,"rev_surprise_pct":-0.4,"status":"reviewed","file":"reports/ETSY/2025-12-31.json","cal_quarter":"2025 Q4"},{"ticker":"ETSY","fiscal_period":"Q1 2026","period_end":"2026-03-31","report_date":"2026-04-29","headline":"Etsy marketplace GMS rose 5.5% (3.6% FX-neutral) and buyers grew again quarter over quarter; FY GMS outlook raised to low single digits.","metrics":{"revenue_bn":0.6313,"revenue_yoy_pct":3.1,"revenue_consensus_bn":0.6211,"comp_pct":5.5,"comp_label":"Etsy marketplace GMS (+3.6% FX-neutral)","traffic_pct":null,"ticket_pct":null,"ecom_yoy_pct":null,"gross_margin_bps":null,"eps_adj":0.89,"eps_consensus":0.62,"inventory_yoy_pct":null,"stock_reaction_pct":null,"eps_ex_one_offs":null},"guidance":"raised","guidance_note":"FY 2026 marketplace GMS growth raised to low single digits (from slight growth); Q2 GMS guided to $2.48-2.53bn (+3-5%); FY adj. EBITDA margin 28-30% unchanged.","key_messages":["Etsy marketplace GMS ~$2.46bn, +5.5% YoY but only +3.6% FX-neutral; management cited FX and an easy prior-year comparison.","Active buyers 86.6m (TTM), the first quarter-over-quarter gain in two years; GMS per active buyer $122 (TTM)." themes":["high_income_gains","low_income_stress","traffic_up","digital_strength","weather_calendar"],"macro_read":"Spending held up in spring 2026 helped by tax refunds, but a widening income split and rising gas prices signaled pressure building for lower-income households.","sources":[{"label":"Walmart Q1 FY27 release (SEC)","url":"https://www.sec.gov/Archives/edgar/data/104169/000010416926000095/earningsreleasefy27q1.htm"},{"label":"CNBC: Walmart issues worse-than-expected outlook as gas prices hit shoppers","url":"https://www.cnbc.com/2026/05/21/walmart-wmt-earnings-q1-2027.html"},{"label":"Barchart: Walmart Q1 earnings call highlights","url":"https://www.barchart.com/story/news/2086137/walmart-q1-earnings-call-highlights"},{"label":"Retail Insight Network: Walmart Q1 revenue rises 7.3%","url":"https://www.retail-insight-network.com/newsletters/walmart-q1-revenue-rises-7-3"}],"eps_surprise_pct":0.0,"rev_surprise_pct":null,"status":"reviewed","notes":[],"one_offs_undisclosed":false,"file":"reports/WMT/2026-04-30.json","cal_quarter":"2026 Q1"},{"ticker":"WMT","fiscal_period":"Q2 FY2027","period_end":"2026-07-31","report_date":"2026-08-20","headline":"Walmart beat on revenue and EPS and raised its sales outlook, but U.S. comps slowed to 2.6% and shares fell ~9%.","metrics":{"revenue_bn":187.9,"revenue_yoy_pct":5.9,"revenue_consensus_bn":186.8,"comp_pct":2.6,"comp_label":"Walmart U.S. comp ex fuel","traffic_pct":1.5,"ticket_pct":1.1,"ecom_yoy_pct":23,"gross_margin_bps":96,"eps_adj":0.81,"eps_consensus":0.74,"inventory_yoy_pct":null,"stock_reaction_pct":-9.2,"eps_ex_one_offs":null},"guidance":"mixed","guidance_note":"FY27 net sales growth raised to 4-5% (from 3.5-4.5%), adj. EPS $2.80-2.87; Q3 guide of 3-3.75% sales and $0.62-0.64 EPS disappointed.","key_messages":["Walmart U.S. comp ex fuel slowed to +2.6% (transactions +1.5%, ticket +1.1%) vs ~3.5-3.8% expected; pharmacy drug-pricing law cut ~125 bps.","Sam's Club U.S. comp ex fuel +4.4% with transactions up ~7%; Sam's eCommerce +26%.","Global eCommerce +23%, Walmart U.S. eCommerce +24%; U.S. marketplace sales +52%.","Tariff (IEEPA) refunds lifted gross margin; Walmart is plowing them into prices (>11,000 rollbacks vs 7,200 at end of Q1).","Fuel costs expected to exceed $2B for the year; Walmart U.S. inventory up ~6.3% partly on cost inflation."],"consumer":{"verdict":"choosy","income_split":"Share gains across the business; lower-income households managing trade-offs as fuel prices rose. CFO John David Rainey said higher fuel prices prompted more trade-offs, particularly in June.","big_ticket":null,"pricing":"Tariff refunds reinvested into rollbacks, especially consumables; cost inflation and higher fuel costs noted.","quote":null},"themes":["value_seeking","price_deflation","tariff_pricing","traffic_up","digital_strength","membership_strength"],"macro_read":"Even the share-gaining value leader saw U.S. comps decelerate as fuel costs squeezed budgets, pointing to a consumer making more trade-offs mid-2026.","sources":[{"label":"Walmart Q2 FY27 release","url":"https://corporate.walmart.com/news/2026/08/20/walmart-releases-q2-fy27-earnings"},{"label":"Chain Store Age: Walmart beats Q2 EPS, misses U.S. comps","url":"https://chainstoreage.com/walmart-beats-street-q2-eps-revenues-misses-us-comp-sales"},{"label":"Finviz: Walmart shares slide on slower U.S. comps","url":"https://finviz.com/news/384107/walmart-shares-slide-as-slower-us-comparable-sales-overshadow-earnings-beat"},{"label":"Motley Fool Q2 FY27 call transcript","url":"https://www.fool.com/earnings/call-transcripts/2026/08/27/walmart-wmt-q2-2027-earnings-call-transcript/"}],"notes":["IEEPA tariff refunds lifted gross margin (+96bp, from a summary of the release); the per-share effect was not disclosed, so part of the beat may come from them."],"one_offs_undisclosed":true,"eps_surprise_pct":9.5,"rev_surprise_pct":0.6,"status":"reviewed","file":"reports/WMT/2026-07-31.json","cal_quarter":"2026 Q2"}],"calendar":{"AMZN":{"date":"2027-02-04","confirmed":false,"label":"Q4 2026","basis":"Based on last year (Feb 5, after the close); not yet announced."},"BBY":{"date":"2026-11-24","confirmed":true,"label":"Q3 FY2027","time":"before the open, call 8am ET"},"COST":{"date":"2026-12-10","confirmed":true,"label":"Q1 FY2027","time":"after the close, call 5pm ET"},"DG":{"date":"2026-12-03","confirmed":false,"label":"Q3 2026","basis":"Based on last year (Dec 4, before the open); not yet announced."},"DLTR":{"date":"2026-11-24","confirmed":true,"label":"Q3 2026","time":"before the open, call 8am ET"},"EBAY":{"date":"2027-02-18","confirmed":false,"label":"Q4 2026","basis":"Based on last year (Feb 18, after the close); not yet announced."},"ETSY":{"date":"2027-02-19","confirmed":false,"label":"Q4 2026","basis":"Based on last year (Feb 19); not yet announced."},"HD":{"date":"2026-11-17","confirmed":true,"label":"Q3 FY2026","time":"before the open, call 9am ET"},"KR":{"date":"2026-12-03","confirmed":false,"label":"Q3 2026","basis":"Based on last year (Dec 4); some calendars show Nov 26. Not yet announced."},"LOW":{"date":"2026-11-18","confirmed":false,"label":"Q3 FY2026","basis":"Listed as tentative on Lowe's investor calendar; no announcement yet."},"ROST":{"date":"2026-11-19","confirmed":false,"label":"Q3 FY2026","basis":"Based on last year (Nov 20, after the close); not yet announced."},"TGT":{"date":"2026-11-18","confirmed":true,"label":"Q3 2026","time":"before the open, call 8am ET"},"TJX":{"date":"2026-11-18","confirmed":true,"label":"Q3 FY2027","time":"before the open, call 11am ET"},"WMT":{"date":"2026-11-19","confirmed":true,"label":"Q3 FY2027","time":"before the open, call 8am ET"}},"data_notes":[{"title":"Where the starting data came from","body":"The 48 reports in place at launch (the last four quarters per retailer, through Amazon's Oct 29, 2026 release) were compiled from web-search summaries of company releases, SEC filings and financial press. The source pages themselves could not be opened, so each figure is as quoted in those summaries. Each card links its sources; check any number against the linked release before quoting it."},{"title":"Blank figures","body":"A dash means the figure was not reported, could not be found, or sources disagreed. Analyst consensus and stock reactions are blank most often. A few figures supplied from memory rather than a source were removed: Walmart Q3 FY2026 consensus and stock reaction, and Costco Q1 FY2026 consensus."},{"title":"Judgements, not data","body":"The consumer verdict (strong, steady, choosy, strained), the theme tags, the one-line \"What it says\" headline, the Economy line and the briefing at the top are written judgements based on what management said."},{"title":"Stock reaction on report day","body":"Only a few reports have a confirmed close-to-close move. The pulse tile shows a median only when at least half the retailers have one, and always says how many it covers."},{"title":"Tariff refunds and other one-time items in EPS","body":"In mid-2026 many retailers booked one-time IEEPA tariff refunds. Where the per-share effect was disclosed (Target, Dollar Tree, Dollar General, Costco), the EPS beat is measured without it. Where it was not (Home Depot, Walmart, Best Buy), the card says part of the beat may come from refunds, and the pulse tile counts those separately. TJX and Ross adjusted EPS already exclude refunds. Amazon's EPS is GAAP and in Q1 and Q2 2026 included large gains on its Anthropic investment, so no consensus comparison is shown. Etsy's EPS is GAAP from continuing operations; eBay's is non-GAAP."},{"title":"E-commerce figures are growth, not comps","body":"Amazon reports total online-stores growth, eBay gross merchandise volume (GMV) and Etsy gross merchandise sales (GMS): what shoppers bought, including new business, not like-for-like comparable sales. They have a dashed outline in the heatmap and left out of the median comp. Amazon's Q3 2026 growth of 2% was held down by Prime Day moving into June (about 4 points); eBay's Q3 2026 GMV growth includes about 3 points from buying Depop."},{"title":"Comps are measured differently by each retailer","body":"Walmart: Walmart U.S. ex fuel. Costco: U.S. ex gas and FX. Home Depot: U.S. comps. Kroger: identical sales ex fuel. Best Buy: Domestic. Dollar Tree: Dollar Tree segment. Others: total comparable sales. Treat small gaps between retailers as approximate."},{"title":"Calendar-quarter alignment","body":"Fiscal quarters are placed in the calendar quarter they mostly cover. Costco (12- and 16-week quarters) and Kroger (a 16-week first quarter) do not line up exactly, so their columns are approximate."},{"title":"Report dates","body":"Upcoming dates are estimates from past schedules and earnings calendars unless marked confirmed."},{"title":"Automatic drafts","body":"New reports are drafted from the press release each company files with the SEC, checked twice every weekday and hourly in the second half of February, May, August and November. Press releases carry no consensus estimates or stock moves, so drafts leave those blank. Drafts carry an \"auto-drafted\" badge until reviewed."}],"briefing":{"as_of":"2026-11-05","verdict":"choosy","headline":"Still spending, but choosy: value wins, housing stalls","summary":"Sales are still growing at almost every big retailer and most beat profit estimates, but shoppers are trading down, traffic is moving to the cheapest formats, and housing-linked spending is flat. One-time tariff refunds flattered many of the profit beats.","implications":["Consumption is slowing, not contracting: median comps near +3.7%, driven by more shoppers at value chains rather than bigger baskets.","Lower- and middle-income budgets are stretched by fuel and food; higher earners are the swing shoppers at discounters.","Goods prices should ease: retailers say they are passing tariff refunds through as price cuts."],"segments":{"mass":"Traffic up at Walmart, Costco and Target; Walmart U.S. comps slowed to +2.6% as fuel squeezed budgets.","ecom":"Amazon's +2% is a Prime Day timing quirk; eBay (+16%) and Etsy (+8.8%) sped up and raised outlooks.","home":"Flat: Home Depot +1.3%, Lowe's +0.2%, fewer transactions; big remodels wait for housing turnover.","offprice":"Strongest segment: Ross +10% on traffic; TJX +4%, with HomeGoods +7%.","value":"Traffic-led gains (+3.5% to +3.7%) as higher earners trade in; core low-income shoppers still stretched.","electronics":"Best Buy +4.5% on PC replacement and new gadgets: fewer, pricier items.","luxury":"Luxury results are being added.","grocery":"Kroger barely growing (+0.2%) on drug-price rules and cautious shoppers; sales outlook cut."},"working":[{"title":"Traffic at value formats","body":"Ross, Target, Costco, Dollar General and Walmart all grew customer counts."},{"title":"Replacement-cycle tech","body":"Best Buy comps +4.5% on PCs and new gadgets; outlook raised."},{"title":"Online marketplaces","body":"eBay merchandise volume +16% and Etsy +8.8% in Q3; both raised outlooks."}],"pressure":[{"title":"Housing-linked spending","body":"Home Depot +1.3% and Lowe's +0.2% with fewer transactions; Lowe's cut its outlook."},{"title":"Lower-income budgets","body":"Fuel and food costs pinch; dollar stores gain as higher earners trade down."},{"title":"Grocery volumes","body":"Kroger identical sales +0.2% and a lower sales outlook."}],"watch":[{"title":"Holiday guidance, Nov 17–24","body":"Home Depot, Target, TJX, Walmart, Best Buy and Dollar Tree report within one week."},{"title":"Tariff refunds","body":"Whether refunds keep turning into price cuts, and how much of the profit beats they were."},{"title":"Amazon Q4","body":"The clean read on online demand once the Prime Day shift washes out."}]}};

<script>
/* Retail Earnings Monitor: renders window.RETAIL_DATA (built by scripts/build.py).
   No framework, no build step. Charts are small hand-written SVG / HTML. */
(function () {
  "use strict";
  const D = window.RETAIL_DATA;
  const app = document.getElementById("app");
  if (!D) { app.innerHTML = '<p class="wrap">No data yet. Run <code>python retail/scripts/build.py</code>.</p>'; return; }

  // ---------- helpers
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const isNum = (v) => typeof v === "number" && isFinite(v);
  const pct = (v, d = 1) => (isNum(v) ? (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + "%" : "—");
  const cls = (v) => (isNum(v) ? (v > 0 ? "up" : v < 0 ? "dn" : "") : "");
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const fmtDate = (iso) => { const [y, m, d] = iso.split("-").map(Number); return `${MONTHS[m - 1]} ${d}, ${y}`; };
  const money = (bn, currency) => {
    const cur = { EUR: "€", GBP: "£" }[currency] || "$";
    return bn < 1 ? `${cur}${Math.round(bn * 1000)}m` : `${cur}${bn.toFixed(1)}bn`;
  };
  const median = (xs) => { const a = xs.filter(isNum).sort((p, q) => p - q); if (!a.length) return null; const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
  const today = new Date().toISOString().slice(0, 10);

  const retailers = Object.fromEntries(D.retailers.map((r) => [r.ticker, r]));
  const cats = Object.fromEntries(D.categories.map((c) => [c.key, c]));
  const VERD = { strong: "Strong", steady: "Steady", choosy: "Choosy", strained: "Strained" };
  const VERD_NOTE = {
    strong: "broad demand, accelerating",
    steady: "healthy, little change",
    choosy: "spending, but picky and deal-driven",
    strained: "pulling back, stress showing",
  };
  const GUIDE = { raised: "Raised", maintained: "Held", lowered: "Cut", initiated: "Initiated", mixed: "Mixed", none: "—" };

  const hist = {};          // ticker -> reviewed/draft reports, newest first
  const pending = {};       // ticker -> newest pending stub (results filed, not yet summarised)
  for (const r of D.reports) {
    if (r.status === "pending") { if (!pending[r.ticker] || r.report_date > pending[r.ticker].report_date) pending[r.ticker] = r; continue; }
    (hist[r.ticker] = hist[r.ticker] || []).push(r);
  }
  Object.values(hist).forEach((a) => a.sort((p, q) => q.report_date.localeCompare(p.report_date)));
  const latest = D.retailers.map((r) => hist[r.ticker]?.[0]).filter(Boolean);
  let page = 0;  // index into PAGES

  // ---------- masthead + briefing
  function mast() {
    const newest = [...D.reports].sort((a, b) => b.report_date.localeCompare(a.report_date))[0];
    const next = Object.entries(D.calendar || {}).filter(([, c]) => c.date >= today).sort((a, b) => a[1].date.localeCompare(b[1].date))[0];
    return `<header class="wrap mast">
      <div><h1>Retail <span>Earnings</span> Monitor</h1>
      <p>Each quarterly report from the biggest U.S. retailers, read for what it says about the consumer and the economy: who is spending, on what, and how it is changing.</p></div>
      <div class="stamp">
        ${newest ? `Latest report <b>${esc(retailers[newest.ticker].name)}</b> · ${fmtDate(newest.report_date)}<br>` : ""}
        ${next ? `Next up <b>${esc(retailers[next[0]].name)}</b> · ${fmtDate(next[1].date)}${next[1].confirmed ? "" : " (est.)"}<br>` : ""}
        ${D.reports.length} reports · ${D.retailers.length} retailers · built ${fmtDate(D.built)}
      </div></header>`;
  }

  // ---------- executive summary
  const SEVERITY = { strong: 0, steady: 1, choosy: 2, strained: 3 };
  function modeVerdict(rs) {
    const n = {};
    rs.forEach((r) => (n[r.consumer.verdict] = (n[r.consumer.verdict] || 0) + 1));
    // most common; a tie goes to the weaker reading
    return Object.keys(n).sort((x, y) => n[y] - n[x] || SEVERITY[y] - SEVERITY[x])[0];
  }
  function stats() {
    const growthOnly = latest.filter((r) => retailers[r.ticker].comp_is_growth);
    const comps = latest.filter((r) => !retailers[r.ticker].comp_is_growth).map((r) => r.metrics.comp_pct);
    const withEst = latest.filter((r) => isNum(r.eps_surprise_pct));
    const beatRs = withEst.filter((r) => r.eps_surprise_pct > 0);
    const moves = latest.map((r) => r.metrics.stock_reaction_pct).filter(isNum);
    return {
      growthOnly, comps, withEst, beats: beatRs.length,
      murky: beatRs.filter((r) => r.one_offs_undisclosed).length,
      raised: latest.filter((r) => r.guidance === "raised").length,
      cut: latest.filter((r) => r.guidance === "lowered").length,
      moves, enoughMoves: moves.length >= Math.ceil(latest.length / 2),
    };
  }

  function briefing() {
    const b = D.briefing || {};
    const st = stats();
    const verdicts = latest.map((r) => r.consumer.verdict);
    const count = (v) => verdicts.filter((x) => x === v).length;
    const overall = b.verdict || modeVerdict(latest);

    const mix = D.verdicts.filter(count).map((v) =>
      `<div class="${v}" style="flex:${count(v)}" title="${VERD[v]}: ${count(v)}">${count(v)}</div>`).join("");

    // segment rows: verdict, median latest growth, change vs the quarter before
    const segRows = D.categories.map((c) => {
      const ts = D.retailers.filter((t) => t.category === c.key);
      const now = ts.map((t) => hist[t.ticker]?.[0]).filter(Boolean);
      const prev = ts.map((t) => hist[t.ticker]?.[1]).filter(Boolean);
      if (!now.length) return "";
      const v = modeVerdict(now);
      const m = median(now.map((r) => r.metrics.comp_pct));
      const mp = median(prev.map((r) => r.metrics.comp_pct));
      const d = isNum(m) && isNum(mp) ? m - mp : null;
      const growth = ts.every((t) => t.comp_is_growth);
      const arrow = !isNum(d) ? "—" : d > 0.25 ? `▲ ${Math.abs(d).toFixed(1)} pts` : d < -0.25 ? `▼ ${Math.abs(d).toFixed(1)} pts` : "≈ flat";
      return `<tr>
        <th scope="row"><a href="#${c.key}">${esc(c.name)}</a><span>${ts.map((t) => esc(t.name)).join(", ")}</span></th>
        <td><span class="verd ${v}">${VERD[v]}</span></td>
        <td class="num">${pct(m)}${growth ? '<span class="gnote">growth</span>' : ""}</td>
        <td class="num delta ${isNum(d) ? (d > 0.25 ? "up" : d < -0.25 ? "dn" : "") : ""}">${arrow}</td>
        <td class="read">${esc(b.segments?.[c.key] || cats[c.key].reads)}</td>
      </tr>`;
    }).join("");

    const col = (title, cls, items) => items?.length ? `<div class="col ${cls}"><h3>${title}</h3><ul>${items.map((i) =>
      `<li><b>${esc(i.title)}</b><span>${esc(i.body)}</span></li>`).join("")}</ul></div>` : "";

    return `<section class="wrap exec" aria-label="Executive summary">
      <div class="bottom">
        <div class="bl-top">
          <div class="eyebrow">Bottom line${b.as_of ? ` · as of ${fmtDate(b.as_of)}` : ""}</div>
          <span class="verd big ${overall}" title="${VERD_NOTE[overall]}">Consumer: ${VERD[overall]}</span>
        </div>
        <h2>${esc(b.headline || "Latest reports by retailer")}</h2>
        ${b.summary ? `<p class="sum">${esc(b.summary)}</p>` : ""}
        ${b.implications?.length ? `<div class="sowhat"><div class="eyebrow">What it means</div><ul>${b.implications.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
        ${b.auto ? `<div class="autonote">Drafted automatically from the latest reports.</div>` : ""}
      </div>

      <div class="block">
        <div class="eyebrow">Scorecard · latest report from each of ${latest.length} retailers</div>
        <div class="score">
          <div class="tile"><div class="k">Consumer signal</div>
            <div class="mix" role="img" aria-label="${D.verdicts.map((v) => `${VERD[v]} ${count(v)}`).join(", ")}">${mix}</div>
            <div class="s">${D.verdicts.filter(count).map((v) => `${VERD[v]} ${count(v)}`).join(" · ")}</div></div>
          <div class="tile"><div class="k">Median comp sales</div><div class="v">${pct(median(st.comps))}</div>
            <div class="s">${st.comps.filter(isNum).length} retailers; ${st.growthOnly.length} growth-only reporters left out</div></div>
          <div class="tile"><div class="k">Beat EPS estimates</div><div class="v">${st.beats}/${st.withEst.length}</div>
            <div class="s">one-offs removed where disclosed${st.murky ? `; ${st.murky} include refunds of unknown size` : ""}</div></div>
          <div class="tile"><div class="k">Guidance</div><div class="v"><span class="up">${st.raised}▲</span> <span class="dn">${st.cut}▼</span></div>
            <div class="s">raised vs cut; ${latest.length - st.raised - st.cut} held, mixed or none</div></div>
          <div class="tile"><div class="k">Stock reaction</div><div class="v ${st.enoughMoves ? cls(median(st.moves)) : ""}">${st.enoughMoves ? pct(median(st.moves)) : "—"}</div>
            <div class="s">${st.enoughMoves ? `median on report day, ${st.moves.length} retailers` : `only ${st.moves.length} of ${latest.length} have a confirmed move`}</div></div>
        </div>
      </div>

      <div class="block">
        <div class="eyebrow">By segment · click a segment for its page</div>
        <div class="scroll"><table class="seg">
          <thead><tr><th scope="col">Segment</th><th scope="col">Consumer</th><th scope="col">Latest growth</th><th scope="col">vs prior quarter</th><th scope="col">The read</th></tr></thead>
          <tbody>${segRows}</tbody>
        </table></div>
        <div class="scale">Latest growth is the median of each segment's latest comp (or growth, where marked). "vs prior quarter" compares it with the same retailers' previous quarter.</div>
      </div>

      <div class="block cols3">
        ${col("What's working", "pos", b.working)}
        ${col("Under pressure", "neg", b.pressure)}
        ${col("What to watch", "watch", b.watch)}
      </div>
    </section>`;
  }

  function themesPanel() {
    const tally = {};
    latest.forEach((r) => (r.themes || []).forEach((t) => (tally[t] = (tally[t] || 0) + 1)));
    const top = Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 8);
    return `<section class="wrap sec heat-sec"><div class="sec-head"><div class="eyebrow">What management keeps raising · retailers citing it in their latest report</div></div>
      <div class="panel themes">${top.map(([t, n]) => `<div class="theme"><span class="lab" title="${esc(D.themes[t])}">${esc(D.themes[t])}</span>
      <span class="track"><span class="fill" style="width:${(n / latest.length) * 100}%"></span></span><span class="n">${n}</span></div>`).join("")}</div></section>`;
  }

  // ---------- page strip (sticky): one tab per page, plus previous / next
  function nav() {
    return `<nav class="bar" aria-label="Pages"><div class="wrap">
      <div class="tabs">${PAGES.map((pg, i) => `<a href="#${pg.key}" data-page="${i}"><span class="pn">${i + 1}</span>${esc(pg.short || pg.label)}</a>`).join("")}</div>
      <div class="arrows"><button type="button" data-step="-1" aria-label="Previous page">←</button><button type="button" data-step="1" aria-label="Next page">→</button></div>
    </div></nav>`;
  }

  // ---------- retailer cards
  function spark(reports) {
    const pts = reports.slice(0, 6).reverse().filter((r) => isNum(r.metrics.comp_pct));
    if (pts.length < 2) return "";
    const W = 320, H = 92, top = 16, bottom = 18, left = 4, right = 4;
    const vals = pts.map((r) => r.metrics.comp_pct);
    const hi = Math.max(0, ...vals), lo = Math.min(0, ...vals), span = hi - lo || 1;
    const y = (v) => top + ((hi - v) / span) * (H - top - bottom);
    const bw = (W - left - right) / pts.length;
    const bars = pts.map((r, i) => {
      const v = r.metrics.comp_pct, x = left + i * bw + bw * 0.2, w = bw * 0.6;
      const y0 = y(0), y1 = y(v), last = i === pts.length - 1;
      const yTop = Math.min(y0, y1), h = Math.max(Math.abs(y1 - y0), 1.5);
      const rr = Math.min(4, w / 2, h);
      // 4px rounded data end, square at the baseline
      const path = v >= 0
        ? `M${x},${y0}V${yTop + rr}Q${x},${yTop} ${x + rr},${yTop}H${x + w - rr}Q${x + w},${yTop} ${x + w},${yTop + rr}V${y0}Z`
        : `M${x},${y0}V${yTop + h - rr}Q${x},${yTop + h} ${x + rr},${yTop + h}H${x + w - rr}Q${x + w},${yTop + h} ${x + w},${yTop + h - rr}V${y0}Z`;
      const tip = `${r.fiscal_period}\n${pct(v)} ${r.metrics.comp_label || ""}\nreported ${fmtDate(r.report_date)}`;
      return `<g data-tip="${esc(tip)}"><rect x="${left + i * bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>
        <path d="${path}" fill="var(--bar)" opacity="${last ? 1 : 0.55}"/>
        ${last ? `<text class="lbl" x="${x + w / 2}" y="${v >= 0 ? yTop - 4 : yTop + h + 11}" text-anchor="middle">${pct(v)}</text>` : ""}
        <text x="${x + w / 2}" y="${H - 4}" text-anchor="middle">${esc(shortQ(r))}</text></g>`;
    }).join("");
    return `<div class="spark"><div class="spark-head"><span>Comp sales by calendar quarter</span><span>hover for detail</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Comparable sales, last ${pts.length} quarters: ${pts.map((r) => `${r.fiscal_period} ${pct(r.metrics.comp_pct)}`).join(", ")}">
      <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--rule)" stroke-width="1"/>${bars}</svg></div>`;
  }
  const shortQ = (r) => (r.cal_quarter ? r.cal_quarter.replace(/^\d{2}(\d{2}) (Q\d)$/, "$2 '$1") : r.fiscal_period);

  function kv(r) {
    const m = r.metrics;
    const base = isNum(m.eps_ex_one_offs) ? m.eps_ex_one_offs : m.eps_adj;
    const eps = isNum(base) ? `$${base.toFixed(2)}${r.one_offs_undisclosed ? "*" : ""}${isNum(m.eps_consensus) ? ` vs ${m.eps_consensus.toFixed(2)}` : ""}` : "—";
    const rows = [
      ["Revenue", isNum(m.revenue_bn) ? money(m.revenue_bn, m.currency) : "—", ""],
      ["Rev. YoY", pct(m.revenue_yoy_pct), cls(m.revenue_yoy_pct)],
      ["Traffic", pct(m.traffic_pct), cls(m.traffic_pct)],
      ["Ticket", pct(m.ticket_pct), cls(m.ticket_pct)],
      ["Digital", pct(m.ecom_yoy_pct, 0), cls(m.ecom_yoy_pct)],
      ["Gross margin", isNum(m.gross_margin_bps) ? `${m.gross_margin_bps > 0 ? "+" : m.gross_margin_bps < 0 ? "−" : ""}${Math.abs(m.gross_margin_bps)}bp` : "—", cls(m.gross_margin_bps)],
      [isNum(m.eps_ex_one_offs) ? "EPS ex one-offs" : "EPS", eps, cls(r.eps_surprise_pct)],
      ...(isNum(m.eps_ex_one_offs) ? [["EPS reported", `$${m.eps_adj.toFixed(2)}`, ""]] : []),
      ["Guidance", GUIDE[r.guidance] || "—", r.guidance === "raised" ? "up" : r.guidance === "lowered" ? "dn" : ""],
      ["Stock, day", pct(m.stock_reaction_pct), cls(m.stock_reaction_pct)],
      ["Inventory", pct(m.inventory_yoy_pct), ""],
    ].filter(([, v]) => v !== "—");
    return rows.map(([k, v, c]) => `<div${k.startsWith("EPS") ? ' class="wide"' : ""}><span>${k}</span><b class="${c}">${esc(v)}</b></div>`).join("");
  }

  function card(t) {
    const rs = hist[t.ticker];
    const pend = pending[t.ticker];
    if (!rs) {
      return `<article class="rc"><div class="rc-top"><div class="rc-name"><h3>${esc(t.name)}</h3><span class="tk">${t.ticker}</span></div></div>
        <p class="autonote">No reports yet.</p></article>`;
    }
    const r = rs[0], c = r.consumer || {}, m = r.metrics;
    const newer = pend && pend.report_date > r.report_date;
    const consumerBits = [
      c.income_split && `<div><b>By income:</b> ${esc(c.income_split)}</div>`,
      c.big_ticket && `<div><b>Discretionary:</b> ${esc(c.big_ticket)}</div>`,
      c.pricing && `<div><b>Pricing:</b> ${esc(c.pricing)}</div>`,
    ].filter(Boolean).join("");
    const past = rs.slice(1).map((p) => `<div><div class="ph"><b>${esc(p.fiscal_period)}</b><span class="verd ${p.consumer.verdict}">${VERD[p.consumer.verdict]}</span>
      <span class="when">comp ${pct(p.metrics.comp_pct)} · ${fmtDate(p.report_date)}</span></div><p>${esc(p.headline)}</p>${p.notes?.length ? `<p class="pnote">Note: ${esc(p.notes.join(" "))}</p>` : ""}</div>`).join("");
    const srcs = (r.sources || []).map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join("");
    return `<article class="rc" id="r-${t.ticker}">
      <div class="rc-top">
        <div><div class="rc-name"><h3>${esc(t.name)}</h3><span class="tk">${t.ticker}</span></div>
        <div class="when">${esc(r.fiscal_period)} · reported ${fmtDate(r.report_date)}</div></div>
        <span class="verd ${c.verdict}" title="Consumer: ${VERD_NOTE[c.verdict]}">${VERD[c.verdict]}</span>
      </div>
      ${newer ? `<div><span class="badge">New results filed ${fmtDate(pend.report_date)} · summary pending</span>
        ${pend.sources?.[0] ? ` <a class="srcs" href="${esc(pend.sources[0].url)}" target="_blank" rel="noopener">filing</a>` : ""}</div>` : ""}
      ${r.status === "draft" ? `<div><span class="badge">Auto-drafted from the press release · not yet reviewed</span></div>` : ""}
      <p class="says">${esc(r.headline)}</p>
      <div class="strip">
        <div class="pricetag"><span class="v">${pct(m.comp_pct)}</span><span class="l">${esc(m.comp_label || t.comp_label)}</span></div>
        <div class="kv">${kv(r)}</div>
      </div>
      <ul class="msgs">${(r.key_messages || []).map((k) => `<li>${esc(k)}</li>`).join("")}</ul>
      ${consumerBits ? `<div class="consumer">${consumerBits}</div>` : ""}
      ${c.quote ? `<blockquote class="quote">“${esc(c.quote.replace(/^["“]|["”]$/g, ""))}”</blockquote>` : ""}
      ${spark(rs)}
      ${r.themes?.length ? `<div class="themes-row">${r.themes.map((th) => `<span class="pill">${esc(D.themes[th])}</span>`).join("")}</div>` : ""}
      ${r.macro_read ? `<div class="macro"><b>Economy</b>${esc(r.macro_read)}</div>` : ""}
      ${r.guidance_note ? `<div class="consumer"><div><b>Outlook:</b> ${esc(r.guidance_note)}</div></div>` : ""}
      ${r.notes?.length ? `<div class="dnotes"><b>Data notes</b><ul>${r.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul></div>` : ""}
      ${past ? `<details class="hist"><summary>Earlier quarters (${rs.length - 1})</summary><div class="past">${past}</div></details>` : ""}
      ${srcs ? `<div class="srcs">Sources: ${srcs}</div>` : ""}
    </article>`;
  }

  function glance(ts) {
    return `<div class="glance">${ts.map((t) => {
      const r = hist[t.ticker]?.[0];
      if (!r) return "";
      return `<a class="g" href="#r-${t.ticker}"><span class="gn">${esc(t.name)}</span><span class="gv num">${pct(r.metrics.comp_pct)}</span>${t.comp_is_growth ? `<span class="gtag">growth</span>` : ""}
        <span class="verd ${r.consumer.verdict}">${VERD[r.consumer.verdict]}</span></a>`;
    }).join("")}</div>`;
  }
  function categoryPage(c) {
    const ts = D.retailers.filter((r) => r.category === c.key);
    return `<section class="wrap cat"><div class="cards">${ts.map(card).join("")}</div></section>`;
  }

  // ---------- comp heatmap: retailers x calendar quarter
  function heatmap() {
    const qs = [...new Set(D.reports.filter((r) => r.cal_quarter).map((r) => r.cal_quarter))].sort().slice(-6);
    const rows = D.retailers;
    const bucket = (v) => (v >= 5 ? "p3" : v >= 2 ? "p2" : v >= 0.5 ? "p1" : v > -0.5 ? "" : v > -2 ? "n1" : v > -5 ? "n2" : "n3");
    const lab = (q) => q.replace(/^(\d{4}) (Q\d)$/, "$2 $1");
    const body = rows.map((t) => {
      const cells = qs.map((q) => {
        const r = (hist[t.ticker] || []).find((x) => x.cal_quarter === q);
        if (!r || !isNum(r.metrics.comp_pct)) return `<td class="na">·</td>`;
        const v = r.metrics.comp_pct;
        const tip = `${t.name} ${r.fiscal_period}\n${pct(v)} ${r.metrics.comp_label || t.comp_label}\nconsumer: ${VERD[r.consumer.verdict]}`;
        const g = t.comp_is_growth;
        return `<td class="${bucket(v)}${g ? " growth" : ""}" data-tip="${esc(tip + (g ? "\ngrowth, not a like-for-like comp" : ""))}" tabindex="0">${pct(v)}</td>`;
      }).join("");
      return `<tr><th class="rowh" scope="row">${esc(t.name)}<span>${t.ticker}${t.comp_is_growth ? " · growth" : ""}</span></th>${cells}</tr>`;
    }).join("");
    const sw = [["n3", "≤ −5"], ["n2", "−5 to −2"], ["n1", "−2 to −0.5"], ["", "flat"], ["p1", "0.5 to 2"], ["p2", "2 to 5"], ["p3", "≥ 5"]];
    return `<section class="wrap sec heat-sec"><div class="sec-head"><div class="eyebrow">Comp sales, quarter by quarter</div>
      <p>Each retailer's headline comparable-sales growth, lined up by the calendar quarter it covers so different fiscal years compare. Blue is growth, red is decline. Hover a cell for the fiscal quarter. Each retailer defines comps a little differently, so treat small gaps as approximate.</p></div>
      <div class="panel scroll"><table class="heat"><thead><tr><th></th>${qs.map((q) => `<th scope="col">${lab(q)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>
      <div class="scale">${sw.map(([c, l]) => `<span><i style="background:var(--div-${c ? (c[0] === "p" ? "pos-" : "neg-") + c[1] : "mid"})"></i> ${l}</span>`).join("")} <span>% comp</span></div>
      ${D.retailers.some((t) => t.comp_is_growth) ? `<div class="scale"><i class="growth-key"></i> Dashed outline (${esc(D.retailers.filter((t) => t.comp_is_growth).map((t) => t.name).join(", "))}): total sales or merchandise-volume growth, not a like-for-like comp.</div>` : ""}</div></section>`;
  }

  // ---------- calendar
  function calendar() {
    const evs = Object.entries(D.calendar || {}).map(([tk, c]) => ({ tk, ...c })).filter((e) => retailers[e.tk])
      .sort((a, b) => a.date.localeCompare(b.date));
    if (!evs.length) return "";
    return `<section class="wrap sec">
      <div class="cal">${evs.map((e) => {
        const [, m, d] = e.date.split("-").map(Number);
        return `<div class="ev ${e.date < today ? "past-ev" : ""}"><div class="date"><span>${MONTHS[m - 1]}</span><b>${d}</b></div>
        <div class="who">${esc(retailers[e.tk].name)} <span class="tk" style="font:12px var(--mono);color:var(--muted)">${e.tk}</span></div>
        <div class="what">${esc(e.label || "")}${e.confirmed
          ? `${e.time ? ` · ${esc(e.time)}` : ""} · <b class="conf">confirmed</b>`
          : ` · estimated${e.basis ? `<span class="basis">${esc(e.basis)}</span>` : ""}`}${e.date < today ? " · awaiting data" : ""}</div></div>`;
      }).join("")}</div></section>`;
  }

  function foot() {
    return `<section class="wrap foot">
      <p><b>How to read it.</b> Each card is the retailer's latest quarter. The yellow tag is its headline comparable-sales growth (stores open a year or more, plus digital where the company counts it). The consumer verdict is a judgement from what management said: <b>strong</b> (${VERD_NOTE.strong}), <b>steady</b> (${VERD_NOTE.steady}), <b>choosy</b> (${VERD_NOTE.choosy}), <b>strained</b> (${VERD_NOTE.strained}).</p>
      ${D.data_notes?.length ? `<dl class="datanotes">${D.data_notes.map((n) => `<dt>${esc(n.title)}</dt><dd>${esc(n.body)}</dd>`).join("")}</dl>` : ""}
    </section>`;
  }

  // ---------- pages
  const PAGES = [
    { key: "summary", label: "Executive summary", short: "Summary",
      lead: "What the latest earnings say about the U.S. consumer, on one page.",
      body: () => briefing() + heatmap() + themesPanel() },
    ...D.categories.map((c) => ({
      key: c.key, label: c.name, short: c.short, lead: c.reads,
      head: () => glance(D.retailers.filter((r) => r.category === c.key)),
      body: () => categoryPage(c),
    })),
    { key: "calendar", label: "Earnings calendar", short: "Calendar",
      lead: "Next scheduled reports. Dates marked estimated have not been confirmed by the company.",
      body: () => calendar() },
    { key: "notes", label: "Notes on the data", short: "Notes",
      lead: "How to read the dashboard, where the numbers come from, and what to keep in mind.",
      body: () => foot() },
  ];
  const indexOf = (key) => PAGES.findIndex((pg) => pg.key === key);

  function pager() {
    const prev = PAGES[page - 1], next = PAGES[page + 1];
    return `<nav class="wrap pager" aria-label="Previous and next page">
      ${prev ? `<a class="pg prev" href="#${prev.key}"><span>← Previous</span><b>${esc(prev.label)}</b></a>` : "<span></span>"}
      <span class="count num">${page + 1} / ${PAGES.length}</span>
      ${next ? `<a class="pg next" href="#${next.key}"><span>Next →</span><b>${esc(next.label)}</b></a>` : "<span></span>"}
    </nav>`;
  }

  function showPage(i, { scroll = true } = {}) {
    page = Math.max(0, Math.min(PAGES.length - 1, i));
    const pg = PAGES[page];
    const main = document.getElementById("page");
    main.innerHTML = `<header class="wrap page-head">
        <div class="eyebrow">Page ${page + 1} of ${PAGES.length}</div>
        <h2>${esc(pg.label)}</h2>${pg.lead ? `<p>${esc(pg.lead)}</p>` : ""}${pg.head ? pg.head() : ""}
      </header>${pg.body()}${pager()}`;
    main.classList.remove("enter"); void main.offsetWidth; main.classList.add("enter");
    document.querySelectorAll(".tabs a").forEach((a) => {
      const on = Number(a.dataset.page) === page;
      if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
      if (on) a.scrollIntoView({ block: "nearest", inline: "nearest" });
    });
    document.querySelector('.arrows [data-step="-1"]').disabled = page === 0;
    document.querySelector('.arrows [data-step="1"]').disabled = page === PAGES.length - 1;
    document.title = page ? `${pg.label} · Retail Earnings Monitor` : "Retail Earnings Monitor";
    if (scroll) {
      const bar = document.querySelector(".bar");
      const top = page ? bar.offsetTop : 0;
      if (scrollY > top) window.scrollTo({ top });
    }
  }
  const go = (i) => {
    if (i < 0 || i >= PAGES.length || i === page) return;
    location.hash = PAGES[i].key;  // hashchange shows it, and Back flips back
  };

  app.innerHTML = mast() + nav() + `<main id="page"></main>`;
  showPage(Math.max(0, indexOf(location.hash.slice(1))), { scroll: false });
  window.addEventListener("hashchange", () => {
    const key = location.hash.slice(1);
    const i = indexOf(key);
    if (i >= 0) { showPage(i); return; }
    if (key.startsWith("r-")) {  // jump to a retailer card from the at-a-glance strip
      const el = document.getElementById(key);
      if (el) el.scrollIntoView({ block: "start" });
    }
  });

  app.addEventListener("click", (e) => {
    const step = e.target.closest("[data-step]");
    if (step) go(page + Number(step.dataset.step));
    const g = e.target.closest("a.g");
    if (g) { e.preventDefault(); document.querySelector(g.getAttribute("href"))?.scrollIntoView({ block: "start" }); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (e.target.closest("input, textarea, select, [contenteditable]")) return;
    if (e.key === "ArrowRight") go(page + 1);
    if (e.key === "ArrowLeft") go(page - 1);
  });
  // swipe left / right to flip on touch screens (not when swiping inside a scrolling table)
  let touch = null;
  app.addEventListener("touchstart", (e) => {
    touch = e.target.closest(".scroll, .tabs") ? null : { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  app.addEventListener("touchend", (e) => {
    if (!touch) return;
    const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
    touch = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) go(page + (dx < 0 ? 1 : -1));
  }, { passive: true });

  // one floating tooltip for every [data-tip] mark
  const tip = document.createElement("div");
  tip.className = "tip"; tip.hidden = true; document.body.appendChild(tip);
  const show = (el) => {
    const r = el.getBoundingClientRect();
    tip.textContent = el.dataset.tip; tip.hidden = false;
    tip.style.left = Math.min(Math.max(r.left + r.width / 2 + scrollX, 90), document.documentElement.clientWidth - 90 + scrollX) + "px";
    tip.style.top = r.top + scrollY + "px";
  };
  app.addEventListener("pointerover", (e) => { const el = e.target.closest("[data-tip]"); if (el) show(el); });
  app.addEventListener("pointerout", (e) => { if (e.target.closest("[data-tip]")) tip.hidden = true; });
  app.addEventListener("focusin", (e) => { const el = e.target.closest("[data-tip]"); if (el) show(el); });
  app.addEventListener("focusout", () => { tip.hidden = true; });
})();
</script>
</body>
</html>
